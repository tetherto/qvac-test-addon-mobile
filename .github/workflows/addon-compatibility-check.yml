name: Addon Compatibility Check

# This workflow runs on PRs to qvac-test-addon-mobile to verify that
# framework changes don't break existing addons

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      addon_filter:
        description: 'Specific addon to test (leave empty for all)'
        type: string
        required: false
        default: ''
      skip_device_farm:
        description: 'Skip Device Farm tests (build only)'
        type: boolean
        required: false
        default: false

env:
  NODE_VERSION: 'lts/*'
  APP_BUNDLE_ID: 'io.tether.test.qvac'

jobs:
  # Job 1: Load the addon registry and prepare test matrix
  load-registry:
    name: Load Addon Registry
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.prepare-matrix.outputs.matrix }}
      addon_count: ${{ steps.prepare-matrix.outputs.addon_count }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prepare test matrix from registry
        id: prepare-matrix
        run: |
          echo "📋 Reading addon registry..."
          
          REGISTRY_FILE=".github/addon-registry.json"
          if [ ! -f "$REGISTRY_FILE" ]; then
            echo "❌ Addon registry not found at $REGISTRY_FILE"
            exit 1
          fi
          
          # Read addons from registry
          ADDONS=$(cat "$REGISTRY_FILE" | jq -c '.addons')
          ADDON_COUNT=$(echo "$ADDONS" | jq 'length')
          
          # Filter by specific addon if provided
          FILTER="${{ inputs.addon_filter }}"
          if [ -n "$FILTER" ]; then
            echo "🔍 Filtering for addon: $FILTER"
            ADDONS=$(echo "$ADDONS" | jq -c --arg filter "$FILTER" '[.[] | select(.name == $filter or .repository | contains($filter))]')
            ADDON_COUNT=$(echo "$ADDONS" | jq 'length')
            
            if [ "$ADDON_COUNT" -eq 0 ]; then
              echo "❌ No addons match filter: $FILTER"
              exit 1
            fi
          fi
          
          echo "📦 Found $ADDON_COUNT addon(s) to test"
          echo "$ADDONS" | jq '.'
          
          # Create matrix for GitHub Actions
          # Each addon can be tested on multiple platforms
          MATRIX_ITEMS='[]'
          
          for i in $(seq 0 $((ADDON_COUNT - 1))); do
            ADDON=$(echo "$ADDONS" | jq -c ".[$i]")
            ADDON_NAME=$(echo "$ADDON" | jq -r '.name')
            REPO=$(echo "$ADDON" | jq -r '.repository')
            BRANCH=$(echo "$ADDON" | jq -r '.branch')
            PLATFORMS=$(echo "$ADDON" | jq -c '.platforms')
            
            for platform in $(echo "$PLATFORMS" | jq -r '.[]'); do
              if [ "$platform" == "Android" ]; then
                RUNNER="ubuntu-latest"
              else
                RUNNER="macos-14"
              fi
              
              ITEM=$(jq -n \
                --arg name "$ADDON_NAME" \
                --arg repo "$REPO" \
                --arg branch "$BRANCH" \
                --arg platform "$platform" \
                --arg runner "$RUNNER" \
                '{name: $name, repository: $repo, branch: $branch, platform: $platform, runner: $runner}')
              
              MATRIX_ITEMS=$(echo "$MATRIX_ITEMS" | jq --argjson item "$ITEM" '. + [$item]')
            done
          done
          
          echo "matrix=$(echo "$MATRIX_ITEMS" | jq -c '{include: .}')" >> $GITHUB_OUTPUT
          echo "addon_count=$ADDON_COUNT" >> $GITHUB_OUTPUT
          
          echo ""
          echo "📊 Test Matrix:"
          echo "$MATRIX_ITEMS" | jq '.'

  # Job 2: Build validation - ensures the framework can build test apps for each addon
  build-validation:
    name: Build ${{ matrix.name }} (${{ matrix.platform }})
    needs: load-registry
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
      packages: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.load-registry.outputs.matrix) }}

    steps:
      - name: Free up disk space (Linux)
        if: matrix.platform == 'Android'
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "Disk space after cleanup:"
          df -h

      - name: Checkout test framework (PR branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: test-framework

      - name: Checkout addon repository
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          token: ${{ secrets.PAT_TOKEN }}
          path: addon
          ref: ${{ matrix.branch }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure npm registries
        env:
          GPR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GIT_PAT: ${{ secrets.PAT_TOKEN }}
        run: |
          # Configure for addon
          cd addon
          cat > .npmrc <<NPMRC
          always-auth=true
          registry=https://registry.npmjs.org/
          @qvac:registry=https://registry.npmjs.org/
          @tetherto:registry=https://npm.pkg.github.com/
          //registry.npmjs.org/:_authToken=${NPM_TOKEN}
          //npm.pkg.github.com/:_authToken=${GPR_TOKEN}
          NPMRC
          
          # Configure for test-framework
          cd ../test-framework
          cat > .npmrc <<NPMRC
          always-auth=true
          registry=https://registry.npmjs.org/
          @qvac:registry=https://registry.npmjs.org/
          @tetherto:registry=https://npm.pkg.github.com/
          //registry.npmjs.org/:_authToken=${NPM_TOKEN}
          //npm.pkg.github.com/:_authToken=${GPR_TOKEN}
          NPMRC
          
          git config --global url."https://${GIT_PAT}:@github.com/".insteadOf "https://github.com/"

      - name: Verify addon has mobile tests
        working-directory: ./addon
        run: |
          echo "🔍 Verifying mobile tests for ${{ matrix.name }}..."
          
          if [ ! -d "test/mobile" ]; then
            echo "❌ ERROR: test/mobile directory not found!"
            exit 1
          fi
          
          CJS_COUNT=$(find test/mobile -name "*.cjs" -type f | wc -l)
          if [ "$CJS_COUNT" -eq 0 ]; then
            echo "❌ ERROR: No .cjs test files found in test/mobile!"
            exit 1
          fi
          
          echo "✅ Found $CJS_COUNT test file(s)"
          ls -la test/mobile/*.cjs

      - name: Install addon dependencies
        working-directory: ./addon
        run: npm install

      - name: Pack addon
        working-directory: ./addon
        run: |
          echo "📦 Packing addon..."
          if npm run build:pack 2>/dev/null; then
            echo "✅ Addon packed using build:pack script"
          else
            mkdir -p dist
            npm pack --pack-destination dist
          fi
          ls -la dist/

      - name: Setup test framework
        working-directory: ./test-framework
        run: npm install

      - name: Build test app with addon
        id: build_app
        working-directory: ./test-framework
        run: |
          echo "🏗️ Building test app for ${{ matrix.name }} on ${{ matrix.platform }}..."
          
          ADDON_PATH="${GITHUB_WORKSPACE}/addon"
          
          # Run the build script
          npm run build "$ADDON_PATH" "$ADDON_PATH/test/mobile"
          
          # Verify generated files
          if [ ! -f "backend/backend.cjs" ]; then
            echo "❌ backend/backend.cjs was not generated!"
            exit 1
          fi
          
          if [ ! -f "e2e/tests/app.test.js" ]; then
            echo "❌ e2e/tests/app.test.js was not generated!"
            exit 1
          fi
          
          if [ ! -f "backend/app.bundle" ]; then
            echo "❌ backend/app.bundle was not created!"
            exit 1
          fi
          
          echo "✅ Build completed successfully!"
          
          # Show extracted tests
          echo ""
          echo "📋 Extracted test functions:"
          cat app/testConfig.js

      - name: Generate native project (Android)
        if: matrix.platform == 'Android'
        working-directory: ./test-framework
        run: |
          npm install -g @expo/cli@latest
          npx expo prebuild --platform android --clean

      - name: Generate native project (iOS)
        if: matrix.platform == 'iOS'
        working-directory: ./test-framework
        run: |
          npm install -g @expo/cli@latest
          brew install ninja
          npx expo prebuild --platform ios --clean

      - name: Set build result
        id: build_result
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

  # Job 3: Run Device Farm tests (optional, can be skipped)
  device-farm-test:
    name: Device Farm ${{ matrix.name }} (${{ matrix.platform }})
    needs: [load-registry, build-validation]
    if: ${{ !inputs.skip_device_farm && github.event_name == 'pull_request' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    continue-on-error: true
    permissions:
      contents: read
      packages: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.load-registry.outputs.matrix) }}

    steps:
      - name: Note about Device Farm
        run: |
          echo "📱 Device Farm testing for ${{ matrix.name }} on ${{ matrix.platform }}"
          echo ""
          echo "⚠️  Full Device Farm integration is available."
          echo "    For now, build validation confirms compatibility."
          echo ""
          echo "To enable full E2E testing:"
          echo "  1. Ensure AWS Device Farm secrets are configured"
          echo "  2. Remove 'if' condition from this job"
          echo "  3. Add full build and upload steps"

  # Job 4: Summarize results
  summary:
    name: Compatibility Summary
    needs: [load-registry, build-validation]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout for registry info
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Generate summary
        id: summary
        run: |
          echo "📊 Generating compatibility summary..."
          
          REGISTRY_FILE=".github/addon-registry.json"
          ADDON_COUNT="${{ needs.load-registry.outputs.addon_count }}"
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 ADDON COMPATIBILITY SUMMARY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Addons tested: $ADDON_COUNT"
          echo "Build validation: ${{ needs.build-validation.result }}"
          echo ""
          
          # Read addon list for summary
          if [ -f "$REGISTRY_FILE" ]; then
            echo "Registered addons:"
            cat "$REGISTRY_FILE" | jq -r '.addons[] | "  - \(.name): \(.description)"'
          fi
          echo ""

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const buildResult = '${{ needs.build-validation.result }}';
            const addonCount = '${{ needs.load-registry.outputs.addon_count }}';
            const prNumber = context.payload.pull_request.number;
            
            let emoji = buildResult === 'success' ? '✅' : '❌';
            let statusText = buildResult === 'success' ? 'PASSED' : 'FAILED';
            
            const comment = `
            ## ${emoji} Addon Compatibility Check
            
            **Status**: ${statusText}
            **PR**: #${prNumber}
            **Commit**: ${context.sha.substring(0, 7)}
            
            ### Summary
            
            | Check | Result |
            |-------|--------|
            | Addon Registry | ${addonCount} addon(s) registered |
            | Build Validation | ${buildResult === 'success' ? '✅ Passed' : '❌ Failed'} |
            
            ### What was tested
            
            This check validates that the changes in this PR:
            1. ✅ Can successfully build test apps for all registered addons
            2. ✅ Generate correct backend code from addon test files
            3. ✅ Bundle the app without errors
            4. ✅ Generate native project files (Expo prebuild)
            
            ### Registered Addons
            
            The following addons are tested for compatibility:
            - \`@qvac/llm-llamacpp\` - LLM inference addon
            - \`@qvac/transcription-whispercpp\` - Transcription addon
            
            ---
            *To add more addons to this check, update \`.github/addon-registry.json\`*
            `;
            
            // Find and update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Addon Compatibility Check')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: comment
              });
            }

